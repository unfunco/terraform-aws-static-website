name: CI

on:
  push:
    branches:
    - main

jobs:
  verify:
    name: Verify (${{ matrix.directory }})
    uses: unfunco/meta/.github/workflows/verify-terraform.yaml@b40ef8e1b220c86892199cb32e2d65d392e74e34 # v0.4.1
    with:
      run-tests: true
      terraform-version-file: .terraform-version
      working-directory: ${{ matrix.directory }}
    strategy:
      fail-fast: false
      matrix:
        directory:
        - .
        - modules/ci-iam-policy

  release:
    name: Release?
    needs: [ verify ]
    permissions:
      contents: write
      pull-requests: write
    uses: unfunco/meta/.github/workflows/release-please.yaml@b40ef8e1b220c86892199cb32e2d65d392e74e34 # v0.4.1
