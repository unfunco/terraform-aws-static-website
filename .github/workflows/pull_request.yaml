name: PR

on:
  pull_request:
    branches:
    - main

jobs:
  verify:
    name: Verify (${{ matrix.directory }})
    uses: unfunco/meta/.github/workflows/verify-terraform.yaml@2cf07936a31dca1b82fe1e447f48e1580c10880e # v0.2.0
    with:
      terraform-version-file: .terraform-version
      working-directory: ${{ matrix.directory }}
    strategy:
      fail-fast: false
      matrix:
        directory:
        - .
        - modules/ci-iam-policy
